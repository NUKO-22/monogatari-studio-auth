<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://rppzoyfpqsllsujrrfsx.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'"
    />
    <title>Monogatari Studio 接続</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans JP", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #251936 0, #111014 48%, #0b0b0d 100%); color: #f3f0f6; }
      .card { width: min(460px, 100%); padding: 30px; border: 1px solid #3d3549; border-radius: 20px; background: rgba(29, 27, 32, .96); box-shadow: 0 28px 90px rgba(0, 0, 0, .48); }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
      .brand img { width: 52px; height: 52px; border-radius: 13px; }
      .eyebrow { margin: 0 0 4px; color: #b99be7; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 22px; }
      .description { margin: 0 0 22px; color: #aaa4b2; line-height: 1.75; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 7px; color: #c8c2cd; font-size: 12px; font-weight: 700; }
      input { width: 100%; padding: 12px 13px; border: 1px solid #48424f; border-radius: 10px; outline: none; background: #141316; color: #fff; font: inherit; }
      input:focus { border-color: #a979e4; box-shadow: 0 0 0 3px rgba(169, 121, 228, .16); }
      button { min-height: 42px; padding: 10px 15px; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 800; }
      button:disabled { cursor: wait; opacity: .55; }
      .primary { background: #9167cc; color: #fff; }
      .secondary { background: #343139; color: #ddd7e2; }
      .actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 10px; }
      .account { margin: 18px 0; padding: 14px; border: 1px solid #3b3641; border-radius: 12px; background: #17161a; color: #cfc9d5; }
      #message { min-height: 22px; margin: 16px 0 0; color: #d8b8ff; font-size: 13px; line-height: 1.6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <img src="./icon.png" alt="" />
        <div><p class="eyebrow">Secure connection</p><h1>Monogatari Studioと接続</h1></div>
      </header>
      <p id="details" class="description">接続内容を確認しています…</p>
      <form id="login" hidden>
        <label>メールアドレス<input id="email" type="email" autocomplete="email" required /></label>
        <label>パスワード<input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="signin" class="primary" type="submit">ログインして続ける</button>
      </form>
      <section id="decision" hidden>
        <div id="account" class="account"></div>
        <div class="actions"><button id="deny" class="secondary" type="button">キャンセル</button><button id="approve" class="primary" type="button">アクセスを許可</button></div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
